

<!DOCTYPE html>

<style>
body{
  font-family:Arial, Helvetica, sans-serif;
  margin:0;
  background:#f6f8fb;
  color:#333;
}
.hidden{display:none}

/* ===== HEADER ===== */
header{
  background:#1e3a8a;
  color:#fff;
  padding:18px 25px;
}
header .top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}
header h1{
  margin:0;
  font-size:22px;
}
.user-info{
  font-size:14px;
  opacity:0.95;
  margin-right:10px;
}
header button{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  background:#fff;
  color:#1e3a8a;
  font-weight:600;
  cursor:pointer;
  margin-left:6px;
}
header button:hover{
  opacity:0.9;
}

/* ===== MAIN ===== */
main{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px 40px;
}

/* ===== SECTION ===== */
.section{
  background:#fff;
  margin-bottom:25px;
  border-radius:10px;
  padding:22px;
  box-shadow:0 4px 10px rgba(0,0,0,0.06);
}
.section h2{
  margin-top:0;
  color:#1e3a8a;
  font-size:20px;
  border-left:5px solid #1e3a8a;
  padding-left:10px;
}
.section p{
  line-height:1.6;
  font-size:15px;
  margin-top:12px;
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
  margin-top:18px;
}
.grid a{
  display:block;
  padding:18px;
  background:#f1f5ff;
  border-radius:10px;
  text-decoration:none;
  color:#1e3a8a;
  font-weight:600;
  text-align:center;
  transition:0.2s;
}
.grid a:hover{
  background:#1e3a8a;
  color:#fff;
  transform:translateY(-2px);
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  font-size:13px;
  color:#666;
  padding-bottom:30px;
}
</style>
</head>

<body>

<header>
  <div class="top">

      <span class="user-info" id="welcome"></span>

    </div>
  </div>
</header>

<script>
/* ===== KIỂM TRA ĐĂNG NHẬP ===== */
if(localStorage.getItem("logged") !== "1"){
  location.href = "index.html";
}

/* ===== HIỂN THỊ TÊN NGƯỜI DÙNG ===== */
document.getElementById("welcome").innerText =
  "👋 Chào mừng, " + localStorage.getItem("email");

/* ===== ĐĂNG XUẤT ===== */
function logout(){
  localStorage.removeItem("logged");
  location.href = "index.html";
}

/* ===== VỀ TRANG CHỦ ===== */
function goHome(){
